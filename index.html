<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Smart PRS</title>

<link rel="stylesheet" href="style.css">

</head>
<body>

<h1>SMART PRS</h1>

<div class="grid">

<div class="card">
<h3>Inlet Pressure</h3>
<p id="inlet">-</p>
</div>

<div class="card">
<h3>Outlet Pressure</h3>
<p id="outlet">-</p>
</div>

<div class="card">
<h3>Temperature</h3>
<p id="temp">-</p>
</div>

<div class="card">
<h3>Gas Flow</h3>
<p id="gasflow">-</p>
</div>

<div class="card">
<h3>Correction Flow</h3>
<p id="corrflow">-</p>
</div>

<div class="card">
<h3>Turbin Meter</h3>
<p id="turbin">-</p>
</div>

<div class="card">
<h3>EVC Meter</h3>
<p id="evc">-</p>
</div>

<div class="card">
<h3>Today Volume</h3>
<p id="today">-</p>
</div>

<div class="card chart-card">
  <h3>Gas Flow Realtime</h3>
  <canvas id="flowChart"></canvas>
</div>

</div>

<p id="update">
Loading...
</p>

<script src="app.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

</body>
</html>
