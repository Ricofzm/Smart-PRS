<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Smart PRS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- NAVBAR -->
<nav class="navbar">

  <div class="nav-title">
    <img
      src="logo.PNG"
      alt="FlowSight"
      class="logo"
    >
  </div>
  
  <div class="header-divider"></div>
  
  <div class="nav-time">
    <div class="live-indicator">
      <span class="dot"></span>

      <div class="live-info">
        <div id="update">--</div>
        <div id="dateNow">--</div>
      </div>
    </div>
  </div>
  
</nav>
<!-- PAGE: DASHBOARD -->
<main class="page active" id="page-dashboard">
  <div class="grid">
    <div class="card" id="card-inlet" onclick="toggleChart('Inlet Pressure','inlet')">
      <h3>Inlet Pressure</h3>
      <p id="inlet">-</p>
      <span class="unit">bar</span>
      <canvas id="spark-inlet" class="sparkline"></canvas>
    </div>
    <div
      class="card"
      id="card-outlet"
      onclick="toggleChart('Outlet Pressure','outlet')">
      <h3>Outlet Pressure</h3>
      <p id="outlet">-</p>
      <span class="unit">bar</span>
      <canvas id="spark-outlet" class="sparkline"></canvas>
    </div>
    <div
      class="card"
      id="card-temp"
      onclick="toggleChart('Temperature','temp')">
      <h3>Temperature</h3>
      <p id="temp">-</p>
      <span class="unit">°C</span>
      <canvas id="spark-temp" class="sparkline"></canvas>
    </div>
    <div
      class="card analytics-card"
      id="card-gasflow"
      onclick="toggleChart('Gas Flow','gasFlow')">
      <h3>Gas Flow</h3>
      <p id="gasflow">-</p>
      <span class="unit">m³/h</span>
      <canvas id="spark-gasflow" class="sparkline"></canvas>
    </div>
    <div class="card" id="card-corrflow"
      onclick="toggleChart('Correction Flow','corrFlow')">
      <h3>Flow Rate</h3>
      <p id="corrflow">-</p>
      <span class="unit">m³/h</span>
      <canvas id="spark-corrflow" class="sparkline"></canvas>
    </div>
    <div class="card analytics-card" id="card-turbin" onclick="toggleChart('Turbin Meter','turbin')">
      <h3>Turbin Meter</h3>
      <p id="turbin">-</p>
      <span class="unit">m³</span>
      <canvas id="spark-turbin" class="sparkline"></canvas>
    </div>
    <div class="card analytics-card" id="card-evc" onclick="toggleChart('EVC Meter','evc')">
      <h3>EVC Meter</h3>
      <p id="evc">-</p>
      <span class="unit">m³</span>
      <canvas id="spark-evc" class="sparkline"></canvas>
    </div>
    <div class="card analytics-card" id="card-today" onclick="toggleChart('Today Volume','today')">
      <h3>Today Volume</h3>
      <p id="today">-</p>
      <span class="unit">m³</span>
      <canvas id="spark-today" class="sparkline"></canvas>
    </div>
    <div class="card analytics-card" id="card-stok">
      <h3>Stok Aman</h3>
      <p id="stok">-</p>
    </div>
    <div class="card" id="card-consumption" onclick="toggleChart('Consumption','consumption')">
      <h3>Consumption</h3>
      <p id="consumption">-</p>
      <span class="unit">bar/h</span>
      <canvas id="spark-consumption" class="sparkline"></canvas>
    </div>
    <div id="chartPanel" class="chart-panel">

      <div class="chart-info">
        <h2 id="chartTitle"></h2>
    
          <div class="metric-value">
            <span id="liveValue">0</span>
            <small id="liveUnit">bar</small>
          </div>
    
          <div id="chartTrend"></div>
    
          <div id="chartStats"></div>
    
      </div>
    
      <div class="chart-graph">
          <canvas id="detailChart"></canvas>
      </div>
    
    </div>
  </div>
</main>

<!-- PAGE: HISTORY -->
<main class="page" id="page-history">

  <div class="page-header">
    <h2>History Data</h2>
  </div>
  
  <div class="history-top">

  <div class="history-tabs">

    <button
      class="history-btn active"
      onclick="switchHistory('hourly',this)"
    >
      Hourly
    </button>

    <button
      class="history-btn"
      onclick="switchHistory('daily',this)"
    >
      Daily
    </button>

  </div>

  <div class="history-filter">

    <input
    type="date"
    id="historyDate"
    onchange="loadHistory()"
    >
    
    <input
    type="month"
    id="historyMonth"
    style="display:none"
    onchange="loadHistory()"
    >

  </div>
  <div id="historyInfo" class="history-info">
    0 record
  </div>
  </div>

  <div class="table-wrap">

    <table>

      <thead id="historyHead">

        <tr>
          <th>Jam</th>
          <th>Inlet</th>
          <th>Outlet</th>
          <th>Temp</th>
          <th>Gas Flow</th>
          <th>Corr Flow</th>
        </tr>

      </thead>

      <tbody id="historyBody">

        <tr>
          <td colspan="6" class="empty">
            Pilih tanggal
          </td>
        </tr>

      </tbody>

    </table>

  </div>

</main>

<nav class="bottom-nav">

  <button
    class="tab-btn active"
    onclick="showPage('dashboard', this)"
  >
    <svg viewBox="0 0 24 24">
      <rect x="3" y="3" width="7" height="7" rx="1"/>
      <rect x="14" y="3" width="7" height="7" rx="1"/>
      <rect x="3" y="14" width="7" height="7" rx="1"/>
      <rect x="14" y="14" width="7" height="7" rx="1"/>
    </svg>
    <span>Dashboard</span>
  </button>
  
  <button
  class="tab-btn"
  onclick="showPage('history', this)"
  >
  <svg viewBox="0 0 24 24">
    <path d="M12 8v5l3 3"/>
    <circle cx="12" cy="12" r="9"/>
    </svg>
  <span>History</span>
  </button>

</nav>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="app.js"></script>
</body>
</html>
